{% extends "layout.html" %}
{% block title %}Change Password — Posting{% endblock %}
{% block content %}
<h1 class="text-2xl font-semibold mb-6">Change Password</h1>
{% if error %}
<div class="mb-4 rounded-md border border-destructive bg-destructive text-destructive-foreground px-4 py-2 text-sm max-w-sm">{{ error }}</div>
{% endif %}
<form method="post" action="/settings/password" class="max-w-sm space-y-4">
  <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
  <div>
    <label class="block text-sm font-medium mb-1" for="current_password">Current password</label>
    <input class="w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring placeholder:text-muted-foreground"
           type="password" id="current_password" name="current_password" required />
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="new_password">New password</label>
    <input class="w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring placeholder:text-muted-foreground"
           type="password" id="new_password" name="new_password" minlength="8" required />
  </div>
  <div>
    <label class="block text-sm font-medium mb-1" for="confirm_password">Confirm new password</label>
    <input class="w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring placeholder:text-muted-foreground"
           type="password" id="confirm_password" name="confirm_password" minlength="8" required />
  </div>
  <button type="submit" class="rounded-md bg-primary text-primary-foreground px-4 py-2 text-sm font-medium hover:bg-primary/90">Update Password</button>
</form>
{% endblock %}
