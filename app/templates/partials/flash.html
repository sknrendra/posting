{% if request.query_params.get("error") %}
<div class="mb-4 rounded border border-black px-4 py-2 text-sm bg-black text-white">
  {{ request.query_params.get("error") }}
</div>
{% endif %}
{% if request.query_params.get("ok") %}
<div class="mb-4 rounded border border-black/20 px-4 py-2 text-sm">
  {{ request.query_params.get("ok") }}
</div>
{% endif %}
