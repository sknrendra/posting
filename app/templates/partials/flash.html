{% if request.query_params.get("error") %}
<div class="mb-4 rounded-md border border-destructive bg-destructive text-destructive-foreground px-4 py-2 text-sm">
  {{ request.query_params.get("error") }}
</div>
{% endif %}
{% if request.query_params.get("ok") %}
<div class="mb-4 rounded-md border border-border bg-card px-4 py-2 text-sm">
  {{ request.query_params.get("ok") }}
</div>
{% endif %}
