{% extends "layout.html" %}
{% block title %}Log in — Posting{% endblock %}
{% block guest_content %}
<div class="w-full max-w-sm">
  <h1 class="text-2xl font-semibold mb-6 text-center">Posting</h1>
  {% if error %}
  <div class="mb-4 rounded border border-black px-4 py-2 text-sm bg-black text-white">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input class="w-full rounded border border-black/20 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-black"
             type="email" id="email" name="email" value="{{ email or '' }}" required autofocus />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input class="w-full rounded border border-black/20 px-3 py-2 focus:outline-none focus:ring-1 focus:ring-black"
             type="password" id="password" name="password" required />
    </div>
    <button type="submit" class="w-full rounded bg-black text-white py-2 font-medium hover:bg-black/80">
      Log in
    </button>
  </form>
</div>
{% endblock %}
