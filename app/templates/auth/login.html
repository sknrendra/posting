{% extends "layout.html" %}
{% block title %}Log in — Posting{% endblock %}
{% block guest_content %}
<div class="w-full max-w-sm rounded-lg border border-border bg-card p-8">
  <h1 class="text-2xl font-semibold mb-6 text-center">Posting</h1>
  {% if error %}
  <div class="mb-4 rounded-md border border-destructive bg-destructive text-destructive-foreground px-4 py-2 text-sm">{{ error }}</div>
  {% endif %}
  <form method="post" action="/login" class="space-y-4">
    <input type="hidden" name="csrf_token" value="{{ csrf_token }}" />
    <div>
      <label class="block text-sm font-medium mb-1" for="email">Email</label>
      <input class="w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring placeholder:text-muted-foreground"
             type="email" id="email" name="email" value="{{ email or '' }}" required autofocus />
    </div>
    <div>
      <label class="block text-sm font-medium mb-1" for="password">Password</label>
      <input class="w-full rounded-md border border-input bg-transparent px-3 py-2 text-sm focus:outline-none focus-visible:ring-2 focus-visible:ring-ring placeholder:text-muted-foreground"
             type="password" id="password" name="password" required />
    </div>
    <button type="submit" class="w-full rounded-md bg-primary text-primary-foreground py-2 font-medium hover:bg-primary/90">
      Log in
    </button>
  </form>
</div>
{% endblock %}
